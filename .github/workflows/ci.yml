name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check bilingual entry points
        run: |
          test -f README.md
          test -f README.zh-CN.md
          test -f CONTRIBUTING.md
          test -f CONTRIBUTING.zh-CN.md
          test -f SECURITY.md
          test -f SECURITY.zh-CN.md
          grep -q 'README.zh-CN.md' README.md
          grep -q 'README.md' README.zh-CN.md
