name: Release

on:
  push:
    tags: ["v*.*.*-alpha.*", "v*.*.*-beta.*", "v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag and metadata
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          [[ "${RELEASE_TAG}" == "v${version}" ]]
          grep -Fq "## [${version}]" CHANGELOG.md
          [[ "$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")" == "${GITHUB_SHA}" ]]

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            binary: mcp-timeout-guard
            archive: tar.gz
          - runner: macos-15
            target: aarch64-apple-darwin
            platform: macos-arm64
            binary: mcp-timeout-guard
            archive: tar.gz
          - runner: macos-15
            target: x86_64-apple-darwin
            platform: macos-x86_64
            binary: mcp-timeout-guard
            archive: tar.gz
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            binary: mcp-timeout-guard.exe
            archive: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Install Rust target
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --no-self-update
          rustup target add "${{ matrix.target }}" --toolchain 1.95.0
      - name: Build binary
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          asset="mcp-timeout-guard-${RELEASE_TAG}-${{ matrix.platform }}"
          mkdir -p "staging/${asset}" dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "staging/${asset}/"
          cp LICENSE README.md README.zh-CN.md CHANGELOG.md "staging/${asset}/"
          tar -czf "dist/${asset}.tar.gz" -C staging "${asset}"
          (cd dist && sha256sum "${asset}.tar.gz" > "${asset}.tar.gz.sha256")
      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = "mcp-timeout-guard-${env:RELEASE_TAG}-${{ matrix.platform }}"
          $dir = "staging/$asset"
          New-Item -ItemType Directory -Path $dir, dist -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" $dir
          Copy-Item LICENSE, README.md, README.zh-CN.md, CHANGELOG.md $dir
          Compress-Archive -Path $dir -DestinationPath "dist/$asset.zip"
          $hash = (Get-FileHash "dist/$asset.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$PWD/dist/$asset.zip.sha256", "$hash  $asset.zip`n", [Text.UTF8Encoding]::new($false))
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  sbom:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Generate SBOM
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --no-self-update
          cargo +1.95.0 install cargo-cyclonedx --version 0.5.9 --locked
          cargo +1.95.0 cyclonedx --format json --describe crate --target all --spec-version 1.5
          mkdir -p dist
          cp mcp-timeout-guard.cdx.json "dist/mcp-timeout-guard-${RELEASE_TAG}.cdx.json"
          (cd dist && sha256sum "mcp-timeout-guard-${RELEASE_TAG}.cdx.json" > "mcp-timeout-guard-${RELEASE_TAG}.cdx.json.sha256")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sbom
          path: dist/*
          if-no-files-found: error

  verify:
    needs: [build, sbom]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify checksums and asset set
        run: |
          set -euo pipefail
          (cd release-assets && sha256sum --check --strict -- ./*.sha256)
          test "$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')" = 10
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-release-assets
          path: release-assets/*
          if-no-files-found: error

  attest:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release-assets
          path: release-assets
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/*.tar.gz
            release-assets/*.zip
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-assets/*.tar.gz
            release-assets/*.zip
          sbom-path: release-assets/mcp-timeout-guard-${{ env.RELEASE_TAG }}.cdx.json

  publish:
    needs: [verify, attest]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release-assets
          path: release-assets
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${RELEASE_TAG}" release-assets/* --repo "${GITHUB_REPOSITORY}" --verify-tag --title "MCP Timeout Guard ${RELEASE_TAG}" --generate-notes --prerelease
