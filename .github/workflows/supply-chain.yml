name: Supply chain

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Install fixed audit tools
        run: |
          cargo +1.95.0 install cargo-deny --version 0.20.2 --locked
          cargo +1.95.0 install cargo-audit --version 0.22.2 --locked
      - run: cargo deny check advisories bans licenses sources
      - run: cargo audit --no-yanked
