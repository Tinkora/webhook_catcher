[package]
name = "webhook-catcher"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
description = "A local webhook capture utility with delivery deduplication"
license = "MIT"
repository = "https://github.com/Tinkora/webhook_catcher"
homepage = "https://github.com/Tinkora/webhook_catcher"
keywords = ["webhook", "http", "debugging", "agent", "cli"]
categories = ["command-line-utilities", "web-programming::http-server"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"

[dev-dependencies]
tempfile = "3.20"
